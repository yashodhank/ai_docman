context_rules:
  - signal: {has_subdirs: ["sites", "themes"]}
    destination: "01_Business/Projects"
    note: "Static site generator"

  - signal: {has_subdirs: ["config", "themes"]}
    destination: "01_Business/Projects"
    note: "Static site generator (config variant)"

  - signal: {has_children_named: ["preferences", "cache", "logs", "viewer", "mobiletrans", "surveyprojects"]}
    destination: "99_Archive"
    note: "App data directory"

  - signal: {child_keywords: ["guru", "mantra", "dharma", "vedic", "tantra", "yoga", "meditation", "swami", "akashic", "cosmology", "blessing", "spiritual", "mukti", "puja"]}
    destination: "02_Personal/Education"
    note: "Spiritual/philosophical content"

  - signal: {all_media_small: true}
    destination: "02_Personal/Education"
    note: "Small all-media directory"

  - signal: {empty_dir: true}
    destination: "99_Archive"
    note: "Empty directory"

# Spiritual file keywords for individual PDF detection
spiritual_file_keywords:
  - guru
  - geeta
  - gita
  - mantra
  - dharma
  - vedic
  - tantra
  - yoga
  - swami
  - mukti
  - puja
  - bhrigu
  - navagraha

dotfiles: "99_Archive"
fallback: "00_Inbox_Documents"
