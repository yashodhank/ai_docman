[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docman"
version = "3.0.0"
description = "AI-powered document management CLI using Ollama for intelligent classification"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "docman contributors"},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "Pillow>=10.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.0",
    "surya-ocr>=0.4.0",
]
watch = [
    "watchdog>=3.0.0",
]
search = [
    "numpy>=1.24.0",
]
all = [
    "docman[ocr]",
    "docman[watch]",
    "docman[search]",
]

[project.scripts]
docman = "docman.cli:main"

[project.urls]
Homepage = "https://github.com/yashodhank/ai_docman"
Issues = "https://github.com/yashodhank/ai_docman/issues"

[tool.setuptools.packages.find]
include = ["docman*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
docman = ["*.yaml"]
