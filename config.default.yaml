# docman default configuration
# Override by passing --config /path/to/custom.yaml

docs_dir: ~/Documents
downloads_dir: ~/Downloads

log_dir: _System/_Logs
index_dir: _System/_Indexes
quarantine_dir: 90_Quarantine_Duplicates
inbox_dir: 00_Inbox_Documents

max_hash_size_mb: 500
downloads_max_depth: 3
downloads_exclude:
  - Projects

# skip_dirs is derived dynamically from file_rules.yaml destinations.
# Override here only if you need a custom list:
# skip_dirs:
#   - _System
#   - 00_Inbox_Documents
#   - 01_Business
#   - ...
skip_dirs: []

keep_in_inbox:
  - Downloads_Triage
  - notes.txt

log_max_bytes: 10485760   # 10 MB
log_backup_count: 10

# --- v3.0 Enhancements ---

cleanup:
  temp_patterns: [".DS_Store", "Thumbs.db", "desktop.ini", "*.tmp", "*.swp", "~$*", "*.pyc", "__pycache__"]
  large_file_threshold_mb: 100

watch:
  directories: ["~/Downloads"]
  debounce_seconds: 5
  auto_classify: true
  auto_classify_confidence: high

ai:
  vision_model: "llava:7b"
  vision_enabled: true

search:
  embedding_model: "nomic-embed-text"
  top_k: 10
